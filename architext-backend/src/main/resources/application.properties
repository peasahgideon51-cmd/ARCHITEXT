# Server
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — value now loaded from .env (never commit real secrets here)
architext.jwt.secret=${JWT_SECRET}
architext.jwt.expiration-ms=86400000

# Flask engine
architext.flask.base-url=${FLASK_BASE_URL}
architext.flask.internal-key=${FLASK_INTERNAL_KEY}

# CORS
architext.cors.allowed-origins=http://localhost:8081,http://localhost:19006,exp://localhost:8081,exp://172.20.10.2:8081

# Logging
logging.level.com.architext=DEBUG
logging.level.org.springframework.security=WARN