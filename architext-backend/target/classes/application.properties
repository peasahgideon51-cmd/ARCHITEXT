# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/architext
spring.datasource.username=postgres
spring.datasource.password=191121
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — replace secret before deploying
# Generate with: openssl rand -hex 64
architext.jwt.secret=architext-secret-key-change-this-before-deploying-to-production-must-be-long
architext.jwt.expiration-ms=86400000

# Flask engine
architext.flask.base-url=http://localhost:5000

# CORS
architext.cors.allowed-origins=http://localhost:8081,http://localhost:19006,exp://localhost:8081,exp://172.20.10.2:8081

# Logging
logging.level.com.architext=DEBUG
logging.level.org.springframework.security=WARN
